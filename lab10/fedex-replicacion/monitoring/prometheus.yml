global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'fedex_api'
    static_configs:
      - targets: ['fedex_api:8080']

  - job_name: 'postgres_exporter'
    static_configs:
      - targets: ['pg_exporter:9187']

  - job_name: 'redis_exporter'
    static_configs:
      - targets: ['redis_exporter:9121']