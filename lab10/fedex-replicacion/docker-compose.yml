version: "3.9"

# ============================================================
#  FedEx Perú — Infraestructura de Replicación Distribuida
# ============================================================
#  INICIO RÁPIDO:
#    1. docker compose up -d pg_lima mongo_lima mongo_bogota mongo_santiago redis_lima redis_bogota redis_sentinel prometheus grafana
#    2. bash scripts/init-replication.sh
#    3. docker compose up -d pg_bogota pg_santiago fedex_api
# ============================================================

networks:
  fedex_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  pg_lima_data:
  pg_bogota_data:
  pg_santiago_data:
  mongo_lima_data:
  mongo_bogota_data:
  mongo_santiago_data:
  redis_lima_data:
  grafana_data:
  prometheus_data:

services:

  # ─────────────────────────────────────────────────────────────
  #  POSTGRESQL — Lima (PRIMARY)
  # ─────────────────────────────────────────────────────────────
  pg_lima:
    image: postgres:16
    container_name: pg_lima_primary
    environment:
      POSTGRES_DB: fedex_db
      POSTGRES_USER: fedex_admin
      POSTGRES_PASSWORD: fedex_pass
    command: >
      postgres
        -c wal_level=replica
        -c max_wal_senders=10
        -c wal_keep_size=256
        -c synchronous_standby_names='FIRST 1 (pg_bogota)'
        -c synchronous_commit=on
        -c hot_standby=on
        -c log_replication_commands=on
    ports:
      - "5432:5432"
    volumes:
      - pg_lima_data:/var/lib/postgresql/data
      - ./init-scripts/pg:/docker-entrypoint-initdb.d
    networks:
      fedex_net:
        ipv4_address: 172.20.0.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fedex_admin -d fedex_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────────────────────
  #  POSTGRESQL — Bogotá (SYNC STANDBY)
  #  Levantado manualmente por init-replication.sh
  # ─────────────────────────────────────────────────────────────
  pg_bogota:
    image: postgres:16
    container_name: pg_bogota_standby
    environment:
      PGPASSWORD: replicator_pass
    command: >
      bash -c "
        rm -rf /var/lib/postgresql/data/* &&
        until pg_basebackup -h pg_lima -U replicator -D /var/lib/postgresql/data -R -P --wal-method=stream -C -S replica_bogota; do
          echo 'Esperando primary Lima...' && sleep 5
        done &&
        echo 'application_name=pg_bogota' >> /var/lib/postgresql/data/postgresql.auto.conf &&
        chown -R postgres:postgres /var/lib/postgresql/data &&
        exec gosu postgres postgres -c hot_standby=on
      "
    ports:
      - "5433:5432"
    volumes:
      - pg_bogota_data:/var/lib/postgresql/data
    depends_on:
      pg_lima:
        condition: service_healthy
    networks:
      fedex_net:
        ipv4_address: 172.20.0.11
    profiles: ["standbys"]

  # ─────────────────────────────────────────────────────────────
  #  POSTGRESQL — Santiago (ASYNC STANDBY)
  # ─────────────────────────────────────────────────────────────
  pg_santiago:
    image: postgres:16
    container_name: pg_santiago_standby
    environment:
      PGPASSWORD: replicator_pass
    command: >
      bash -c "
        rm -rf /var/lib/postgresql/data/* &&
        until pg_basebackup -h pg_lima -U replicator -D /var/lib/postgresql/data -R -P --wal-method=stream -C -S replica_santiago; do
          echo 'Esperando primary Lima...' && sleep 5
        done &&
        echo 'application_name=pg_santiago' >> /var/lib/postgresql/data/postgresql.auto.conf &&
        chown -R postgres:postgres /var/lib/postgresql/data &&
        exec gosu postgres postgres -c hot_standby=on
      "
    ports:
      - "5434:5432"
    volumes:
      - pg_santiago_data:/var/lib/postgresql/data
    depends_on:
      pg_lima:
        condition: service_healthy
    networks:
      fedex_net:
        ipv4_address: 172.20.0.12
    profiles: ["standbys"]

  # ─────────────────────────────────────────────────────────────
  #  MONGODB — Replica Set (3 nodos)
  # ─────────────────────────────────────────────────────────────
  mongo_lima:
    image: mongo:7
    container_name: mongo_lima_primary
    command: mongod --replSet fedexRS --bind_ip_all --port 27017
    ports:
      - "27017:27017"
    volumes:
      - mongo_lima_data:/data/db
    networks:
      fedex_net:
        ipv4_address: 172.20.0.20
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo_bogota:
    image: mongo:7
    container_name: mongo_bogota_secondary
    command: mongod --replSet fedexRS --bind_ip_all --port 27017
    ports:
      - "27018:27017"
    volumes:
      - mongo_bogota_data:/data/db
    networks:
      fedex_net:
        ipv4_address: 172.20.0.21

  mongo_santiago:
    image: mongo:7
    container_name: mongo_santiago_secondary
    command: mongod --replSet fedexRS --bind_ip_all --port 27017
    ports:
      - "27019:27017"
    volumes:
      - mongo_santiago_data:/data/db
    networks:
      fedex_net:
        ipv4_address: 172.20.0.22

  # ─────────────────────────────────────────────────────────────
  #  REDIS — Master + Replica + Sentinel
  # ─────────────────────────────────────────────────────────────
  redis_lima:
    image: redis:7-alpine
    container_name: redis_lima_master
    command: redis-server --requirepass fedex_redis --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_lima_data:/data
    networks:
      fedex_net:
        ipv4_address: 172.20.0.30
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "fedex_redis", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis_bogota:
    image: redis:7-alpine
    container_name: redis_bogota_replica
    command: redis-server --replicaof redis_lima 6379 --requirepass fedex_redis --masterauth fedex_redis
    ports:
      - "6380:6379"
    depends_on:
      redis_lima:
        condition: service_healthy
    networks:
      fedex_net:
        ipv4_address: 172.20.0.31

  redis_sentinel:
    image: redis:7-alpine
    container_name: redis_sentinel
    command: >
      sh -c "
        echo 'bind 0.0.0.0' > /sentinel.conf &&
        echo 'sentinel monitor mymaster redis_lima 6379 1' >> /sentinel.conf &&
        echo 'sentinel auth-pass mymaster fedex_redis' >> /sentinel.conf &&
        echo 'sentinel down-after-milliseconds mymaster 5000' >> /sentinel.conf &&
        echo 'sentinel failover-timeout mymaster 15000' >> /sentinel.conf &&
        echo 'sentinel parallel-syncs mymaster 1' >> /sentinel.conf &&
        redis-sentinel /sentinel.conf
      "
    ports:
      - "26379:26379"
    depends_on:
      redis_lima:
        condition: service_healthy
    networks:
      fedex_net:
        ipv4_address: 172.20.0.32

  # ─────────────────────────────────────────────────────────────
  #  MONITOREO
  # ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: fedex_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      fedex_net:
        ipv4_address: 172.20.0.40

  grafana:
    image: grafana/grafana:latest
    container_name: fedex_grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus]
    networks:
      fedex_net:
        ipv4_address: 172.20.0.41

  # ─────────────────────────────────────────────────────────────
  #  API REST — FedEx Node.js
  # ─────────────────────────────────────────────────────────────
  fedex_api:
    build: ./api
    container_name: fedex_api
    environment:
      PG_PRIMARY_HOST: pg_lima
      PG_REPLICA_HOST: pg_bogota
      MONGO_URI: "mongodb://mongo_lima:27017,mongo_bogota:27017,mongo_santiago:27017/?replicaSet=fedexRS"
      REDIS_SENTINEL_HOST: redis_sentinel
      REDIS_SENTINEL_PORT: 26379
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      pg_lima:
        condition: service_healthy
      mongo_lima:
        condition: service_healthy
      redis_lima:
        condition: service_healthy
    networks:
      fedex_net:
        ipv4_address: 172.20.0.50
    profiles: ["app"]