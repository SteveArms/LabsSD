version: "3.9"

# ============================================================
# Laboratorio 08 - Sistemas Distribuidos
# Sistema Nacional de Bancos Cooperativos
# Tres nodos PostgreSQL: Arequipa, Cusco, Trujillo
# ============================================================

services:

  # ----------------------------------------------------------
  # Nodo 1 - Banco Arequipa (origen de la transferencia)
  # ----------------------------------------------------------
  postgres_arequipa:
    image: postgres:16
    container_name: banco_arequipa
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME_AREQUIPA}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${PORT_AREQUIPA}:5432"
    volumes:
      - ./init/arequipa.sql:/docker-entrypoint-initdb.d/init.sql
      - arequipa_data:/var/lib/postgresql/data
    command: >
      postgres
        -c max_prepared_transactions=10
        -c log_min_messages=info
        -c log_connections=on
    networks:
      - red_bancaria
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME_AREQUIPA}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ----------------------------------------------------------
  # Nodo 2 - Banco Cusco (destino de la transferencia)
  # ----------------------------------------------------------
  postgres_cusco:
    image: postgres:16
    container_name: banco_cusco
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME_CUSCO}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${PORT_CUSCO}:5432"
    volumes:
      - ./init/cusco.sql:/docker-entrypoint-initdb.d/init.sql
      - cusco_data:/var/lib/postgresql/data
    command: >
      postgres
        -c max_prepared_transactions=10
        -c log_min_messages=info
        -c log_connections=on
    networks:
      - red_bancaria
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME_CUSCO}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ----------------------------------------------------------
  # Nodo 3 - Banco Trujillo (nodo disponible, no involucrado)
  # ----------------------------------------------------------
  postgres_trujillo:
    image: postgres:16
    container_name: banco_trujillo
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME_TRUJILLO}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${PORT_TRUJILLO}:5432"
    volumes:
      - ./init/trujillo.sql:/docker-entrypoint-initdb.d/init.sql
      - trujillo_data:/var/lib/postgresql/data
    command: >
      postgres
        -c max_prepared_transactions=10
        -c log_min_messages=info
        -c log_connections=on
    networks:
      - red_bancaria
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME_TRUJILLO}"]
      interval: 5s
      timeout: 5s
      retries: 10

# ----------------------------------------------------------
# Volúmenes persistentes para cada nodo
# ----------------------------------------------------------
volumes:
  arequipa_data:
  cusco_data:
  trujillo_data:

# ----------------------------------------------------------
# Red interna compartida por los tres nodos
# ----------------------------------------------------------
networks:
  red_bancaria:
    driver: bridge
